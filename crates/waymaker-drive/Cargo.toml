[package]
name = "waymaker-drive"
description = "The synchronous driver of design document §06's explicit kernel boundary. Test support: never linked into Waymaker's own firmware, never published, but written to run on the part."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["development-tools::testing", "embedded", "no-std"]
keywords = ["durable", "workflow", "replay", "no-std"]
publish = false

[dependencies]
# The kernel boundary this crate exists to drive: `EffectRequest`, `Intent`, `Resolve`.
waymaker-core.workspace = true
# The bytes the boundary is answered from: the recovery scan, the two-barrier writer, and
# the input digest the kernel may not compute for itself.
waymaker-flash.workspace = true
# The façade issue #35 put over this protocol. `facade`, `ota` and `provisioning` are the
# bridge and design document §06's two examples: they turn "waymaker-embassy is a façade
# over exactly this protocol" into something that compiles, and `tests/power_loss.rs` drives
# the two board clocks through `PersistentClock`. The edge goes this way and never the
# other — nothing in `waymaker-embassy` names this crate — which is what keeps `Boundary`
# usable with the façade removed.
waymaker-embassy.workspace = true

[dev-dependencies]
# The in-memory NOR model and the crash injector. The driver is run at every crash point the
# injector lists, which is what makes "across a power cut" a loop rather than a claim.
waymaker-fault.workspace = true
# Design document §14's failure-semantics table as a vocabulary: `tests/matrix.rs` classifies
# every crash point into a row the rig also names, so both halves of issue #31's matrix use
# one vocabulary.
waymaker-rig.workspace = true

[features]
default = []
# Build this crate as it would be with the façade deleted: `facade`, `ota` and
# `provisioning` are the modules that name `waymaker-embassy`, and this removes them. The
# `drive-facadeless` stage
# builds it, which turns issue #35's "removing the Embassy crate leaves the protocol fully
# usable through the synchronous driver" into a compile rather than a text search.
#
# A negative feature, which is normally an anti-pattern because feature unification turns one
# crate's opt-out into everyone's. The one crate that depends on this one is `xtask`, which
# reads design document §04's context term out of `ota`; nothing selects this feature except
# the `drive-facadeless` stage, which builds this crate alone, so no build unifies the two.
# Enabling it workspace-wide would fail the `xtask` build loudly rather than quietly, which is
# the direction to fail in. The alternative — an optional dependency, off by default — would take
# the façade out of the lint, test, docs and coverage stages, which all pass
# `--no-default-features`.
#
# What it does not prove: the manifest entry above is not optional, so `waymaker-embassy` is
# still resolved and built, and a compile error inside the façade fails the `drive-facadeless`
# stage too. So the stage says "no other module needs the façade" and not "this crate builds
# with the façade deleted". Issue #106 is the crate split that would make the dependency
# graph say the second. That the *source* names the façade in no other file is
# `ctx-facade`'s.
without-facade = []

[lints]
workspace = true
