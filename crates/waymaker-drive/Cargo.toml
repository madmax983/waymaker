[package]
name = "waymaker-drive"
description = "The synchronous driver of design document §06's explicit kernel boundary. Test support: never linked into Waymaker's own firmware, never published, but written to run on the part."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["development-tools::testing", "embedded", "no-std"]
keywords = ["durable", "workflow", "replay", "no-std"]
publish = false

[dependencies]
# The kernel boundary this crate exists to drive: `EffectRequest`, `Intent`, `Resolve`.
waymaker-core.workspace = true
# The bytes the boundary is answered from: the recovery scan, the two-barrier writer, and
# the input digest the kernel may not compute for itself.
waymaker-flash.workspace = true
# The façade issue #35 put over this protocol. `facade` and `ota` are the bridge and design
# document §06's example: they turn "waymaker-embassy is a façade over exactly this protocol"
# into something that compiles, and `tests/power_loss.rs` drives the two board clocks through
# `PersistentClock`. The edge goes this way and never the other — nothing in
# `waymaker-embassy` names this crate — which is what keeps `Boundary` usable with the façade
# removed.
waymaker-embassy.workspace = true

[dev-dependencies]
# The in-memory NOR model and the crash injector. The driver is run at every crash point the
# injector lists, which is what makes "across a power cut" a loop rather than a claim.
waymaker-fault.workspace = true
# Design document §14's failure-semantics table as a vocabulary: `tests/matrix.rs` classifies
# every crash point into a row the rig also names, so both halves of issue #31's matrix use
# one vocabulary.
waymaker-rig.workspace = true

[features]
default = []

[lints]
workspace = true
