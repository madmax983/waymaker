[workspace]
resolver = "3"
members = [
    "crates/waymaker-core",
    "crates/waymaker-flash",
    "crates/waymaker-embassy",
    "crates/waymaker-fault",
    "crates/waymaker-spec",
    "crates/waymaker-size-probe",
    "xtask",
]
# `xtask` is a host tool. Firmware-target builds select the default members so that its
# host-only dependencies never reach `thumbv6m-none-eabi`.
# `waymaker-fault` and `waymaker-spec` are excluded for the same reason: they are host-side
# test support — an in-memory media model and an exhaustive state-space search — and no
# firmware target has any use for either.
# `waymaker-size-probe` is excluded too: its binary is behind `required-features`, so
# selecting it by default would add a member the firmware build has nothing to build.
default-members = [
    "crates/waymaker-core",
    "crates/waymaker-flash",
    "crates/waymaker-embassy",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/madmax983/waymaker"
authors = ["Waymaker contributors"]

[workspace.dependencies]
waymaker-core = { path = "crates/waymaker-core", version = "0.0.0", default-features = false }
waymaker-flash = { path = "crates/waymaker-flash", version = "0.0.0", default-features = false }
waymaker-embassy = { path = "crates/waymaker-embassy", version = "0.0.0", default-features = false }
waymaker-fault = { path = "crates/waymaker-fault", version = "0.0.0", default-features = false }
waymaker-spec = { path = "crates/waymaker-spec", version = "0.0.0", default-features = false }

[workspace.lints.rust]
# Denied rather than forbidden at the workspace level on purpose. Each firmware crate
# raises this to `#![forbid(unsafe_code)]` in its own root, which `cargo xtask
# check-layering` requires; a workspace-level `forbid` cannot be relaxed by any in-crate
# attribute, so the only way out would be to drop `[lints] workspace = true` entirely and
# silently lose pedantic, nursery and unwrap_used with it. `deny` keeps a documented
# exception a reviewable one-line `#![allow(unsafe_code)]` plus an ADR.
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `missing_docs` is set per crate root rather than here: a workspace lint also applies to
# every `tests/*.rs` target, where a missing crate-level doc comment is noise.

[workspace.lints.clippy]
# Negative priority so that the individual denials below outrank the groups.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# `clippy.toml` exempts tests; see `allow-unwrap-in-tests` and `allow-expect-in-tests`.
# Denied, not warned, so that a local `cargo clippy` and CI's `-D warnings` agree.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Design document §04 Resource budgets. The incremental code-flash budget is measured
# against these settings; changing them changes the number CI gates on.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
