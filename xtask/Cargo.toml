[package]
name = "xtask"
description = "Workspace policy gate: the design document's layering contract, enforced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Host-only tooling. `default-members` in the workspace manifest keeps this out of
# firmware-target builds, which cannot compile its dependencies.
[dependencies]
serde_json = "1"
toml = "1"

[lints]
workspace = true
