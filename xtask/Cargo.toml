[package]
name = "xtask"
description = "Workspace policy gate: the design document's layering contract, enforced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Host-only tooling. `default-members` in the workspace manifest keeps this out of
# firmware-target builds, which cannot compile its dependencies.
[dependencies]
# The gate reads the resource budgets from the crate that declares them rather than
# transcribing them. A number that lives in two places is a number that ends up
# disagreeing with itself, and the compile-time assertions and the CI gate must not.
waymaker-core.workspace = true
# The write-amplification figure design document §15 and issue #27 ask to be published
# alongside the size report is *measured*, by running the real journal writer over a modelled
# part, rather than transcribed. Three dependencies, for the same reason `waymaker-core` is
# one: a number that lives in two places is a number that ends up disagreeing with itself.
#
# These are host-only, and the gate is unaffected by them: `check_dependency_direction`
# iterates `policy::LAYERS`, and `xtask` is `policy::HOST_TOOLS`, so this grants no layer
# anything. A layer that ever depended *back* on `xtask` is what `dependency-direction` would
# refuse; Cargo would refuse the cycle before any rule ran.
waymaker-flash.workspace = true
waymaker-fault.workspace = true
waymaker-rig.workspace = true
# Design document §04's context term and the generated workflow futures are *measured* as
# well, on the types the firmware links, rather than transcribed. `waymaker-drive` is where
# a concrete `Ctx` and §06's example workflow are named; issue #39 asks the report to make
# both visible. Host-only, and it grants no layer anything, for the reason above.
waymaker-drive.workspace = true
# Issue: `cargo xtask profile` gates six crates at zero heap blocks, and a crate the
# workload never links can never be attributed one — so the gate would cover it in name and
# not in fact. Codex found exactly that on the first review of the profiling gate:
# `waymaker-conformance` was not in this graph at all, and `waymaker-embassy` was linked
# through `waymaker-drive` and executed by nothing. These two are what the `facade` and
# `conformance` workloads drive, and `profile::ProfileReport::shortfall_report` fails a run
# in which any declared engine crate is still reached by neither.
waymaker-embassy.workspace = true
waymaker-conformance.workspace = true
serde_json = "1"
toml = "1"
# Issue #51: the gate answers syntax questions, so it parses syntax. `syn` reads Rust
# (attributes, `extern crate`, `use` aliases, item structure) and `pulldown-cmark` reads
# Markdown (fenced code, claims), replacing the hand-rolled lexers that review kept
# defeating with another spelling. Both are host-only: `default-members` keeps `xtask`
# out of firmware-target builds, which cannot compile them.
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut"] }
pulldown-cmark = { version = "0.13.3", default-features = false }
# Only the Markdown parser is used (no HTML rendering, no CLI): default features would
# pull `getopts` for the command-line binary, which this gate never runs.
# Rendering a parsed attribute back to the whitespace-free text the old line scanner
# produced (`#![forbid(unsafe_code)]`). Comes along with `syn`'s `printing` feature;
# named here so the `use` is a direct dependency rather than a transitive accident.
quote = "1"
# Reading a `macro_rules!` body for a nested `include!` walks `syn::Macro`'s opaque
# token stream, which is `proc-macro2`'s type. Comes along with `syn`; named here so
# the `use` is a direct dependency rather than a transitive accident.
proc-macro2 = "1"

# The compile-fail test for the kernel-state assertion reads the budget from the crate
# that declares it rather than restating the number it expects to be rejected.
[dev-dependencies]
waymaker-core.workspace = true

[lints]
workspace = true
