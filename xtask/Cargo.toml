[package]
name = "xtask"
description = "Workspace policy gate: the design document's layering contract, enforced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Host-only tooling. `default-members` in the workspace manifest keeps this out of
# firmware-target builds, which cannot compile its dependencies.
[dependencies]
# The gate reads the resource budgets from the crate that declares them rather than
# transcribing them. A number that lives in two places is a number that ends up
# disagreeing with itself, and the compile-time assertions and the CI gate must not.
waymaker-core.workspace = true
# The write-amplification figure design document §15 and issue #27 ask to be published
# alongside the size report is *measured*, by running the real journal writer over a modelled
# part, rather than transcribed. Three dependencies, for the same reason `waymaker-core` is
# one: a number that lives in two places is a number that ends up disagreeing with itself.
#
# These are host-only, and the gate is unaffected by them: `check_dependency_direction`
# iterates `policy::LAYERS`, and `xtask` is `policy::HOST_TOOLS`, so this grants no layer
# anything. What it would catch if it ever became circular is `inputs-incomplete`.
waymaker-flash.workspace = true
waymaker-fault.workspace = true
waymaker-rig.workspace = true
serde_json = "1"
toml = "1"

# The compile-fail test for the kernel-state assertion reads the budget from the crate
# that declares it rather than restating the number it expects to be rejected.
[dev-dependencies]
waymaker-core.workspace = true

[lints]
workspace = true
