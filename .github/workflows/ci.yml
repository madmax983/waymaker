# Rung 0.0 pipeline. Issue #9 extends this with the thumbv6m-none-eabi build, the
# coverage gate, and the pre-commit hooks that mirror it; issue #10 adds the size job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Build
        run: cargo build --workspace --no-default-features

      - name: Test
        run: cargo test --workspace

  layering:
    # The dependency direction is a contract (design document §05), not a convention.
    # This job fails if waymaker-core grows a dependency of any kind, if waymaker-flash
    # reaches for Embassy directly or through another crate, if a crate stops being
    # no_std, or if the release profile or lint table drifts from the design document.
    name: layering contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the layering contract
        run: cargo xtask check-layering
