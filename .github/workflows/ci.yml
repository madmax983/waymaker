# Rung 0.0 pipeline.
#
# Every `run:` below comes from the stage table in `xtask/src/pipeline.rs`. That table is
# also what `cargo xtask install-hooks` renders `.githooks/pre-commit` from, and
# `cargo xtask check-layering` fails a pull request in which this file, the hook, or the
# pinned toolchain has drifted from it. The commands are therefore not repeated here by
# convention — they are checked.
#
# The toolchain comes from rust-toolchain.toml, which every job and a local checkout read,
# so CI is confirmation rather than discovery.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull-request run is wasted work, but cancelling a push to main can leave
# the default branch with no completed run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately not RUSTFLAGS: that is passed to every registry dependency as well, so a
  # new rustc warning inside `toml` or `serde_json` would fail a build with nothing in
  # this repository to fix. The denial belongs on the tools that lint our own code.
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, build, test, docs, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block below explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # The coverage stage shells out to a tool no rustup profile carries. Installed
      # before the pipeline starts so that a missing tool is an install failure rather
      # than a coverage run that quietly did not happen.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --no-default-features

      - name: Test
        run: cargo test --locked --workspace --no-default-features

      - name: Docs
        run: cargo doc --locked --workspace --no-deps --no-default-features

      # Per crate, not per workspace: a total is how an untested kernel hides behind a
      # tested adapter. The gate and the per-crate table live in xtask/src/coverage.rs.
      - name: Coverage
        run: cargo --locked xtask coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/waymaker-coverage.json
          # `warn` rather than `ignore`: the run where the report is missing is the run
          # where someone wants to know why.
          if-no-files-found: warn

  firmware:
    # Design document §15: "Build on `thumbv6m-none-eabi` with no default features." The
    # firmware target is not an occasional check — a change that only builds on the host
    # is not a change that works, so this is its own check in the list rather than a step
    # buried in another job's log.
    #
    # No `--workspace`: `default-members` is exactly the three firmware crates, so a crate
    # added to the layering is built here without anyone remembering a `-p` flag, and
    # `xtask`'s host-only dependencies never reach the firmware target.
    name: thumbv6m-none-eabi build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins `targets = ["thumbv6m-none-eabi"]`, so the target is
      # installed with the toolchain rather than by a step this job could forget.
      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block below explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build the firmware crates for the firmware target
        run: cargo build --locked --no-default-features --target thumbv6m-none-eabi

      # `waymaker-rig` is outside `default-members`, so the step above never sees it — and
      # the whole of ADR 0021 rests on it being code a board can link. `--lib` because its
      # tests are host code by design: they drive `waymaker-fault`, which models media in a
      # `Vec`, and it is the library a board links.
      - name: Build the rig for the firmware target
        run: cargo build --locked -p waymaker-rig --no-default-features --lib --target thumbv6m-none-eabi

      # The size probe's binary is behind `required-features`, so the `check` job's clippy
      # stage — `--all-targets` on the host — never compiles it. Without this step the
      # layering gate reports its `#![no_std]`, `#![forbid(unsafe_code)]` and
      # `#![warn(missing_docs)]` present while no compiler has ever acted on them.
      - name: Lint the size probe on the firmware target
        run: cargo clippy --locked -p waymaker-size-probe --target thumbv6m-none-eabi --features probe,facade --bins -- -D warnings

  size:
    # Design document §04: "CI records section sizes for every feature combination" and
    # the code-flash budget "is a gate, not an unverified claim". This job links the size
    # probe once per feature combination on the firmware target, reads the section headers
    # out of each image, and fails when a delta against the no-Waymaker baseline exceeds a
    # budget — naming the number that did it.
    #
    # Its own job because it links the whole matrix twice on a pull request: once for this
    # branch and once for the base branch it is diffed against. Nothing else in the
    # pipeline is waiting for that, and a budget breach belongs in the checks list rather
    # than at the end of another job's log.
    name: size budgets
    runs-on: ubuntu-latest
    # Links the matrix twice on a pull request, so it gets more room than the other
    # jobs — but not six hours of a runner, which is what no timeout means.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The base-branch diff checks the base out into a worktree and measures it. A
          # shallow clone has no base branch to check out, and the step would report "not
          # compared" on every pull request.
          fetch-depth: 0

      # rust-toolchain.toml pins `targets = ["thumbv6m-none-eabi"]`, so the firmware target
      # the budgets are stated for is installed with the toolchain.
      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block above explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # No arguments: which base branch to diff against comes from GITHUB_BASE_REF, which
      # GitHub sets on pull requests and leaves unset on a push to main. That keeps the
      # command a fixed string, which is what lets the pipeline table in
      # xtask/src/pipeline.rs compare it against this file byte for byte.
      - name: Measure the size budgets
        run: cargo --locked xtask size

      - name: Upload the size and wear reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          # Both, because `cargo xtask size` writes both. Issue #27 asks for the write
          # amplification to be "published alongside the size report", and a JSON that only
          # ever existed in a runner's filesystem is published nowhere — the table in the job
          # log is for a human, and this is the artifact a fleet's figures get compared
          # against later.
          path: |
            target/waymaker-size.json
            target/waymaker-wear.json
          # `warn` rather than `ignore`: the run where a report is missing is the run
          # where someone wants to know why.
          if-no-files-found: warn

  verification:
    # Issue #20: design document §14's five guarantees, proved over the ghost model in
    # `waymaker-spec` by exhaustive enumeration rather than by sampling. The `check` job's
    # test stage runs these too — this job exists for the same reason `layering` does: a
    # guarantee that stopped holding should be legible in the checks list, under a name
    # that says which, rather than as one line in a six-crate test log.
    name: recovery specification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block above explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Verify the recovery invariants
        run: cargo test --locked -p waymaker-spec --no-default-features

  layering:
    # The dependency direction is a contract (design document §05), not a convention.
    # This job fails if waymaker-core grows a dependency of any kind, if waymaker-flash
    # reaches for Embassy directly or through another crate, if a crate stops being
    # no_std or starts allowing unsafe code, if a new workspace member appears that no
    # layer rule covers, if the release profile or lint table drifts from the design
    # document, or if this workflow, the pre-commit hook, and the pipeline table stop
    # agreeing with each other.
    #
    # `cargo test` also runs this gate through xtask's integration tests. This job is
    # kept separate because it is the only thing that exercises the binary a developer
    # runs, and because a layering failure should be legible in the checks list without
    # reading a test log.
    name: layering contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block below explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check the layering contract
        run: cargo --locked xtask check-layering
