# Rung 0.0 pipeline. Issue #10 adds the size job.
#
# Every `run:` below comes from the stage table in `xtask/src/pipeline.rs`. That table is
# also what `cargo xtask install-hooks` renders `.githooks/pre-commit` from, and
# `cargo xtask check-layering` fails a pull request in which this file, the hook, or the
# pinned toolchain has drifted from it. The commands are therefore not repeated here by
# convention — they are checked.
#
# The toolchain comes from rust-toolchain.toml, which every job and a local checkout read,
# so CI is confirmation rather than discovery.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull-request run is wasted work, but cancelling a push to main can leave
# the default branch with no completed run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately not RUSTFLAGS: that is passed to every registry dependency as well, so a
  # new rustc warning inside `toml` or `serde_json` would fail a build with nothing in
  # this repository to fix. The denial belongs on the tools that lint our own code.
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, build, test, docs, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block below explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # The coverage stage shells out to a tool no rustup profile carries. Installed
      # before the pipeline starts so that a missing tool is an install failure rather
      # than a coverage run that quietly did not happen.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --no-default-features

      - name: Test
        run: cargo test --locked --workspace --no-default-features

      - name: Docs
        run: cargo doc --locked --workspace --no-deps --no-default-features

      # Per crate, not per workspace: a total is how an untested kernel hides behind a
      # tested adapter. The gate and the per-crate table live in xtask/src/coverage.rs.
      - name: Coverage
        run: cargo --locked xtask coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/waymaker-coverage.json
          # `warn` rather than `ignore`: the run where the report is missing is the run
          # where someone wants to know why.
          if-no-files-found: warn

  firmware:
    # Design document §15: "Build on `thumbv6m-none-eabi` with no default features." The
    # firmware target is not an occasional check — a change that only builds on the host
    # is not a change that works, so this is its own check in the list rather than a step
    # buried in another job's log.
    #
    # No `--workspace`: `default-members` is exactly the three firmware crates, so a crate
    # added to the layering is built here without anyone remembering a `-p` flag, and
    # `xtask`'s host-only dependencies never reach the firmware target.
    name: thumbv6m-none-eabi build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins `targets = ["thumbv6m-none-eabi"]`, so the target is
      # installed with the toolchain rather than by a step this job could forget.
      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block below explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build the firmware crates for the firmware target
        run: cargo build --locked --no-default-features --target thumbv6m-none-eabi

  layering:
    # The dependency direction is a contract (design document §05), not a convention.
    # This job fails if waymaker-core grows a dependency of any kind, if waymaker-flash
    # reaches for Embassy directly or through another crate, if a crate stops being
    # no_std or starts allowing unsafe code, if a new workspace member appears that no
    # layer rule covers, if the release profile or lint table drifts from the design
    # document, or if this workflow, the pre-commit hook, and the pipeline table stop
    # agreeing with each other.
    #
    # `cargo test` also runs this gate through xtask's integration tests. This job is
    # kept separate because it is the only thing that exercises the binary a developer
    # runs, and because a layering failure should be legible in the checks list without
    # reading a test log.
    name: layering contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rustflags: ""` because this action's default is to put `-D warnings` into
      # RUSTFLAGS, which is exactly the decision the env block below explains not making:
      # RUSTFLAGS reaches every registry dependency too.
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check the layering contract
        run: cargo --locked xtask check-layering
